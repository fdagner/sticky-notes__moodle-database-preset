<div class="defaulttemplate">
  <table class="table">
    <tbody>
      <tr class="lastrow">
        <th class="alert-secondary" scope="row"><i class="fa-solid fa-brush" aria-hidden="true"></i></th>
        <td id="setcolor">[[Color]]</td>
      </tr>
      <tr>
        <th class="alert-secondary" scope="row"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i></th>
        <td>[[Note]]</td>
      </tr>
      <tr>
        <th class="alert-secondary" scope="row"><i class="fa-solid fa-pencil" aria-hidden="true"></i></th>
        <td>
          <details id="whiteboarddetails" open>
            <summary class="btn btn-secondary">Whiteboard</summary>
            <div class="board-toolbar" role="toolbar" aria-label="Zeichenwerkzeuge">
              <input type="color" id="selColor" value="#000000" title="Stiftfarbe wählen" aria-label="Stiftfarbe wählen">
              <label class="width-select-label" for="selWidth">
                <i class="fa-solid fa-pen-nib" aria-hidden="true"></i>
                <select id="selWidth" title="Strichstärke wählen" aria-label="Strichstärke wählen">
                  <option value="2">2</option>
                  <option value="4" selected>4</option>
                  <option value="6">6</option>
                  <option value="8">8</option>
                  <option value="10">10</option>
                  <option value="12">12</option>
                  <option value="14">14</option>
                </select>
              </label>
              <button type="button" id="eraserBtn" class="tool-btn" aria-pressed="false" title="Radierer" aria-label="Radierer">
                <i class="fa-solid fa-eraser" aria-hidden="true"></i>
              </button>
              <button type="button" id="undoBtn" class="tool-btn" title="Rückgängig" aria-label="Rückgängig">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
              </button>
              <button type="button" id="redoBtn" class="tool-btn" title="Wiederholen" aria-label="Wiederholen">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
              </button>
              <button type="button" id="clearButton" class="tool-btn" title="Alles löschen" aria-label="Alles löschen">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
              </button>
            </div>
            <canvas id="canvas" width="800" height="400" role="img" aria-label="Zeichenfläche Whiteboard">Ihr Browser unterstützt kein HTML-Canvas.</canvas>
          </details>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="whiteboard-raw">[[Whiteboard]]</div>

<script>
(() => {
    'use strict';

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const colorInput = document.getElementById('selColor');

    const strokes = [];      // Stored strokes (JSON format)
    let redoStack = [];      // For "Redo"
    let baseImage = null;    // Legacy raster drawing (PNG data URL), used as background
    let baseImageObj = null;
    let current = null;      // Stroke currently being drawn
    let curColor = '#000000';
    let curWidth = 4;
    let isEraser = false;

    // Minimum distance between stored points (normalized coordinates).
    // Keeps large drawings from exceeding the TEXT field limit (~64 KB)
    // and shrinks entries – without visibly wobbly lines.
    const MIN_POINT_DIST = 0.002;

    // Pointer position as a normalized coordinate [0..1] relative to the canvas
    const toNorm = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
        const y = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
        return [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000];
    };

    // Shared stroke drawing logic from jstemplate.js (window.StickyBoard.drawStroke)
    const paintStroke = (stroke) => {
        if (!window.StickyBoard) {
            return;
        }
        window.StickyBoard.drawStroke(context, stroke, canvas.width, canvas.height, canvas.width / 800);
    };

    // Redraw all strokes (after undo/redo/load)
    const redraw = () => {
        if (!window.StickyBoard) {
            return;
        }
        context.clearRect(0, 0, canvas.width, canvas.height);
        if (baseImageObj) {
            context.drawImage(baseImageObj, 0, 0, canvas.width, canvas.height);
        }
        strokes.forEach(paintStroke);
    };

    // Keep the stored raster drawing as an Image object
    const setBaseImage = (dataURL) => {
        baseImage = dataURL;
        if (!dataURL) {
            baseImageObj = null;
            redraw();
            return;
        }
        baseImageObj = new Image();
        baseImageObj.onload = redraw;
        baseImageObj.src = dataURL;
    };

    // Write the drawing as compact JSON into the form field
    const save = () => {
        const textarea = document.getElementById('[[Whiteboard#id]]');
        if (!textarea) {
            return;
        }
        if (strokes.length === 0 && !baseImage) {
            textarea.value = '';
            return;
        }
        const data = { v: 1, w: 800, h: 400, s: strokes };
        if (baseImage) {
            data.b = baseImage;
        }
        textarea.value = JSON.stringify(data);
    };

    const updateToolStates = () => {
        document.getElementById('undoBtn').disabled = strokes.length === 0;
        document.getElementById('redoBtn').disabled = redoStack.length === 0;
    };

    // --- Drawing: one shared pointer code path for mouse and touch ---
    canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) {
            return;
        }
        canvas.setPointerCapture(e.pointerId);
        current = {
            c: curColor,
            w: isEraser ? curWidth + 4 : curWidth,
            e: isEraser ? 1 : 0,
            p: [toNorm(e)]
        };
        paintStroke(current); // start point drawn as a round dot
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!current) {
            return;
        }
        const p = toNorm(e);
        const prev = current.p[current.p.length - 1];
        const dx = p[0] - prev[0];
        const dy = p[1] - prev[1];
        if (dx * dx + dy * dy < MIN_POINT_DIST * MIN_POINT_DIST) {
            return; // point thinning: skip points that are too close together
        }
        current.p.push(p);
        paintStroke({ c: current.c, w: current.w, e: current.e, p: [prev, p] }); // only the new segment
    });

    const finishStroke = () => {
        if (!current) {
            return;
        }
        strokes.push(current);
        current = null;
        redoStack = [];
        save();
        updateToolStates();
    };

    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', () => {
        current = null; // unfinished stroke is discarded
    });

    // --- Tools ---
    colorInput.addEventListener('input', () => {
        curColor = colorInput.value;
    });

    const widthSelect = document.getElementById('selWidth');
    widthSelect.addEventListener('change', () => {
        curWidth = parseInt(widthSelect.value, 10);
    });

    const eraserBtn = document.getElementById('eraserBtn');
    eraserBtn.addEventListener('click', () => {
        isEraser = !isEraser;
        eraserBtn.classList.toggle('is-active', isEraser);
        eraserBtn.setAttribute('aria-pressed', isEraser ? 'true' : 'false');
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (strokes.length === 0) {
            return;
        }
        redoStack.push(strokes.pop());
        redraw();
        save();
        updateToolStates();
    });

    document.getElementById('redoBtn').addEventListener('click', () => {
        if (redoStack.length === 0) {
            return;
        }
        strokes.push(redoStack.pop());
        redraw();
        save();
        updateToolStates();
    });

    document.getElementById('clearButton').addEventListener('click', () => {
        strokes.length = 0;
        redoStack = [];
        setBaseImage(null); // clears the background and redraws
        save();
        updateToolStates();
    });

    // --- Load an existing drawing ---
    // In the add template [[Whiteboard]] renders the form field → read the value from the input.
    // In the view templates the value is plain text → read from textContent.
    const rawDiv = document.querySelector('div.whiteboard-raw');
    let loadedRaw = '';
    if (rawDiv) {
        const fieldInput = rawDiv.querySelector('input, textarea');
        loadedRaw = (fieldInput ? (fieldInput.value || '') : (rawDiv.textContent || '')).trim();
    }

    if (loadedRaw.charAt(0) === '{') {
        try {
            const data = JSON.parse(loadedRaw);
            (data.s || []).forEach((stroke) => strokes.push(stroke));
            if (data.b) {
                setBaseImage(data.b);
            }
        } catch {
            /* Ignore corrupt data */
        }
    } else {
        const match = loadedRaw.match(/data:image\/png;base64,[^'"\s]+/);
        if (match) {
            setBaseImage(match[0]);
        }
    }

    // Draw only once jstemplate.js has loaded (it provides the shared drawing logic)
    document.addEventListener('DOMContentLoaded', () => {
        redraw();
        updateToolStates();
    });

    // --- Optional canvas background (set imgTemplate in jstemplate.js) ---
    window.addEventListener('load', () => {
        if (typeof imgTemplate === 'undefined' || !imgTemplate) {
            return;
        }
        const bg = new Image();
        bg.onload = () => {
            const ratio = Math.min(canvas.width / bg.width, canvas.height / bg.height);
            canvas.style.backgroundImage = `url(${bg.src})`;
            canvas.style.backgroundSize = `${bg.width * ratio}px ${bg.height * ratio}px`;
            canvas.style.backgroundRepeat = 'no-repeat';
            canvas.style.backgroundPosition = 'center';
        };
        bg.src = imgTemplate;
    });

    // --- Card color: round swatches, form gets a color tint preview ---
    const radios = document.querySelectorAll('#setcolor input[type="radio"]');

    // The text labels (white, yellow, pink, …) are displayed as round color tiles.
    // Known values get the pastel tone of the cards, unknown ones the CSS color name.
    const colorHex = {
        white: '#ffffff',
        yellow: '#fde047',
        pink: '#f9a8d4',
        lightblue: '#bfdbfe',
        lightgreen: '#bbf7d0'
    };

    radios.forEach((radio) => {
        const label = document.querySelector(`label[for="${radio.id}"]`);
        if (!label) {
            return;
        }
        const value = (radio.value || '').trim().toLowerCase();
        // Set size/color directly on the label so theme CSS cannot override it
        // (same circular look as the filter buttons in the list view: 26 px + thin border)
        label.style.display = 'inline-flex';
        label.style.boxSizing = 'border-box';
        label.style.width = '26px';
        label.style.minWidth = '26px';
        label.style.height = '26px';
        label.style.padding = '0';
        label.style.border = '1px solid rgba(15, 23, 42, .25)';
        label.style.borderRadius = '50%';
        label.style.overflow = 'hidden';
        label.style.flex = '0 0 auto';
        label.style.verticalAlign = 'middle';
        label.style.backgroundColor = colorHex[value] || value || '#ffffff';
        label.setAttribute('title', value);
    });

    const applyCanvasColor = (value) => {
        // Use the same pastel tones as on the cards (not the raw CSS color names)
        const v = (value || '').trim().toLowerCase();
        const color = colorHex[v] || v || '#ffffff';
        // Tint only the form area as a preview of the card color;
        // the drawing surface stays white everywhere (like in list/single view)
        const form = document.querySelector('.defaulttemplate');
        if (form) {
            form.style.backgroundColor = color;
        }
    };

    radios.forEach((radio) => {
        if (radio.checked) {
            applyCanvasColor(radio.value);
        }
        radio.addEventListener('change', () => applyCanvasColor(radio.value));
    });

    // Collapse the whiteboard section by default
    window.addEventListener('load', () => {
        const details = document.getElementById('whiteboarddetails');
        if (details) {
            details.open = false;
        }
    });
})();
</script>
