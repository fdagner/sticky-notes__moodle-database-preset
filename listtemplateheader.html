<div class="text-right d-print-none note-reload">
  <label for="checkbox1">
    <input type="checkbox" id="checkbox1"> <i class="fa-solid fa-rotate" aria-hidden="true"></i> Automatisch aktualisieren
  </label>
</div>

<div class="note-filter d-print-none" role="group" aria-label="Karten nach Farbe filtern">
  <button type="button" class="note-filter-all is-active" data-filter="">Alle</button>
  <button type="button" class="note-filter-btn" data-filter="yellow" style="background-color:#fde047" title="Gelbe Karten" aria-label="Gelbe Karten filtern"></button>
  <button type="button" class="note-filter-btn" data-filter="pink" style="background-color:#f9a8d4" title="Rosa Karten" aria-label="Rosa Karten filtern"></button>
  <button type="button" class="note-filter-btn" data-filter="lightblue" style="background-color:#bfdbfe" title="Blaue Karten" aria-label="Blaue Karten filtern"></button>
  <button type="button" class="note-filter-btn" data-filter="lightgreen" style="background-color:#bbf7d0" title="Grüne Karten" aria-label="Grüne Karten filtern"></button>
  <button type="button" class="note-filter-btn" data-filter="white" style="background-color:#fff" title="Weiße Karten" aria-label="Weiße Karten filtern"></button>
</div>

<script>
(() => {
    'use strict';

    const checkbox = document.getElementById('checkbox1');
    let timer = null;

    const readStored = () => {
        try {
            return localStorage.getItem('checkbox1') === 'true';
        } catch {
            return false; // storage unavailable (e.g. private mode)
        }
    };

    const writeStored = (value) => {
        try {
            localStorage.setItem('checkbox1', JSON.stringify(value));
        } catch { /* storage unavailable */ }
    };

    checkbox.checked = readStored();

    // --- Quick filter by card color ---
    // Runs on initial load and after every content refresh, so the filter
    // buttons match the current cards.
    const applyFilter = () => {
        const filterButtons = document.querySelectorAll('.note-filter-all, .note-filter-btn');

        // Hide color buttons without matching cards
        const available = [];
        document.querySelectorAll('#data-content .karte').forEach((card) => {
            const color = (card.getAttribute('data-color') || '').trim().toLowerCase();
            if (color !== '' && !available.includes(color)) {
                available.push(color);
            }
        });
        filterButtons.forEach((btn) => {
            const filter = btn.dataset.filter;
            if (filter !== '' && !available.some((color) => color.includes(filter))) {
                btn.style.display = 'none';
            }
        });

        // Re-apply the active filter (otherwise it matches no card after the refresh)
        const active = document.querySelector('.note-filter-all.is-active, .note-filter-btn.is-active');
        const filter = active ? active.dataset.filter : '';
        document.querySelectorAll('#data-content .item').forEach((item) => {
            const card = item.querySelector('.karte');
            const color = card ? (card.getAttribute('data-color') || '') : '';
            const show = filter === '' || color.includes(filter);
            item.style.display = show ? '' : 'none';
        });
    };

    const bindFilterButtons = () => {
        document.querySelectorAll('.note-filter-all, .note-filter-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                document.querySelectorAll('.note-filter-all, .note-filter-btn').forEach((b) => b.classList.remove('is-active'));
                btn.classList.add('is-active');
                document.querySelectorAll('#data-content .item').forEach((item) => {
                    const card = item.querySelector('.karte');
                    const color = card ? (card.getAttribute('data-color') || '') : '';
                    const show = filter === '' || color.includes(filter);
                    item.style.display = show ? '' : 'none';
                });
            });
        });
    };

    // --- Auto-reload without a full page reload ---
    // Fetches the page, parses it and swaps ONLY the card content.
    // No location.reload() → no flicker, scroll position is preserved.
    // 15 s interval and only while the tab is visible, to be kind to the server:
    // tabs in the background refresh on the next tick after returning.
    const refreshContent = () => {
        if (document.hidden) {
            return;
        }
        fetch(location.href, { credentials: 'same-origin' })
            .then((response) => response.text())
            .then((html) => {
                const next = new DOMParser().parseFromString(html, 'text/html').getElementById('data-content');
                const board = document.getElementById('data-content');
                if (next && board && next.innerHTML !== board.innerHTML) {
                    board.innerHTML = next.innerHTML;
                    // Render the whiteboard drawings of the new cards
                    if (window.StickyBoard && window.StickyBoard.renderAll) {
                        window.StickyBoard.renderAll();
                    }
                    // Adjust filter buttons and active filtering to the new cards
                    applyFilter();
                }
            })
            .catch(() => { /* network error: the next tick will retry */ });
    };

    const applyAutoReload = () => {
        writeStored(checkbox.checked);
        if (checkbox.checked && timer === null) {
            timer = setInterval(refreshContent, 15000);
        } else if (!checkbox.checked && timer !== null) {
            clearInterval(timer);
            timer = null;
        }
    };

    checkbox.addEventListener('change', applyAutoReload);
    applyAutoReload();

    // 1000 entries per page – set once per session
    try {
        if (sessionStorage.getItem('ChangeEntriesReload') === null) {
            sessionStorage.setItem('ChangeEntriesReload', 'true');
            const params = new URLSearchParams(location.search);
            if (params.get('perpage') !== '1000') {
                params.set('perpage', '1000');
                location.href = location.pathname + '?' + params.toString();
            }
        }
    } catch { /* storage unavailable – skip the setting */ }

    // Only at DOMContentLoaded: the cards come AFTER this script in the HTML
    document.addEventListener('DOMContentLoaded', () => {
        bindFilterButtons();
        applyFilter();
    });
})();
</script>

<div class="board" id="data-content">
