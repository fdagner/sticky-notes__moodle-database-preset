<div class="note-single">
  <div class="karte2" data-color="[[Color]]">
    <div class="dropdown dropleft note-actions">
      ##actionsmenu##
    </div>
    <div class="note-head">
      ##userpicture## <strong class="note-author">##user##</strong>
    </div>
    <div class="note-body">
      [[Note]]
      <div class="whiteboard-raw">[[Whiteboard]]</div>
      <div class="dataurlview" id="dataurlview"></div>
    </div>
    <div class="note-footer">
      ##comments##
    </div>
  </div>
</div>
<script>
  // Optionaler Hintergrund für die Whiteboard-Vorschau (imgTemplate in jstemplate.js setzen)
  window.addEventListener('load', () => {
    if (typeof imgTemplate === 'undefined' || !imgTemplate) {
      return;
    }
    const view = document.getElementById('dataurlview');
    const canvas = view ? view.querySelector('canvas') : null;
    if (!canvas) {
      return;
    }
    const bg = new Image();
    bg.onload = () => {
      const ratio = Math.min(canvas.width / bg.width, canvas.height / bg.height);
      canvas.style.backgroundImage = `url(${bg.src})`;
      canvas.style.backgroundSize = `${bg.width * ratio}px ${bg.height * ratio}px`;
      canvas.style.backgroundRepeat = 'no-repeat';
      canvas.style.backgroundPosition = 'center';
    };
    bg.src = imgTemplate;
  });
</script>
